<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bảng tin Spirit Ironman Lục Nam</title>
  <!-- Trỏ đến file CSS riêng -->
  <link rel="stylesheet" href="css/feed.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .app-container { padding-bottom: 70px !important; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: 60px;
      background: #ffffff; display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid #e4e6eb; z-index: 1000; box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
    }
    .bottom-nav .nav-item {
      text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; height: 100%; color: #65676b; font-size: 11px;
    }
    .bottom-nav .nav-item i { font-size: 18px; margin-bottom: 3px; }
    .bottom-nav .nav-item.active { color: #1877f2; font-weight: bold; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Thanh tiêu đề -->
  <div class="fb-header">
    <h1>TRI LỤC NAM</h1>
    <div class="user-badge" id="currentUserBadge" onclick="changeUser()">👤 Đang tải...</div>
  </div>

  <!-- Khung đăng bài -->
  <div class="composer-card">
    <div class="composer-top">
      <div class="avatar" id="myAvatar">?</div>
      <textarea class="composer-input" id="captionInput" rows="2" placeholder="Hôm nay anh em bơi, đạp hay chạy thế nào?"></textarea>
    </div>
    
    <!-- Lưới xem trước nhiều ảnh -->
    <div class="preview-box" id="previewBox" style="display:none;">
      <div class="preview-grid" id="previewGrid"></div>
    </div>

    <div class="composer-actions">
      <label class="btn-photo">
        🖼️ Chọn ảnh (Nhiều ảnh)
        <input type="file" id="imageInput" accept="image/*" multiple hidden onchange="handleFilesSelect(event)">
      </label>
      <button class="btn-post" id="btnPost" onclick="createPost()">Đăng</button>
    </div>
  </div>

  <!-- Bảng tin -->
  <div id="newsfeed"></div>

  <!-- Modal xem ảnh Fullscreen -->
  <div id="imageViewerModal" onclick="closeImageViewer()">
    <button class="close-viewer">&times;</button>
    <img id="fullImage" src="">
  </div>

  <!-- THANH ĐIỀU HƯỚNG DƯỚI CÙNG -->
  <nav class="bottom-nav">
      <a href="admin.html" class="nav-item">
          <i class="fa-solid fa-shield-halved"></i>
          <span>ADMIN</span>
      </a>
      <a href="profile.html" class="nav-item">
          <i class="fa-solid fa-medal"></i>
          <span>Tường</span>
      </a>
      <a href="member.html" class="nav-item">
          <i class="fa-solid fa-user"></i>
          <span>Cá nhân</span>
      </a>
      <a href="ranking.html" class="nav-item">
          <i class="fa-solid fa-trophy"></i>
          <span>Xếp hạng</span>
      </a>  
      <a href="wall.html" class="nav-item">
          <i class="fa-solid fa-medal"></i>
          <span>Thành tích</span>
      </a>
      <a href="feed.html" class="nav-item active">
          <i class="fa-solid fa-newspaper"></i>
          <span>Bảng tin</span>
      </a>
  </nav>
</div>

<!-- Nạp script từ tệp js/feed.js riêng -->
<script type="module" src="js/feed.js"></script>
</body>
</html>
